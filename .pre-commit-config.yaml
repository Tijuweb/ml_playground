repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (lint and import sorting)
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: black
        name: Black (Python formatting)
        entry: uv run --locked black
        language: system
        types_or: [python, pyi]
